{% extends "base2.html" %}
{% load static %}

{% block start %}

         <!-- slider section -->
         <section class="slider_section " >
          <div class="container " style="color: black !important;">
            <div class="row">
              <div class="col-lg-9 col-md-12 mx-auto">
                <div class="detail-box" style="color: black !important;">

<body style="overflow: hidden;">
  <!-- Your page content goes here -->
</body>

<div class="container mt-2">
    <form class="col-md-8 mx-auto card p-3 shadow-lg" method="post" enctype="multipart/form-data">
        {%csrf_token%}
        <h1> <center> REGISTER </center>  </h1>
        <br>
        {% if messages %}

        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
            {{message}}
            {% endfor %}
        </div>
        {% endif %}

        <form>
          <div class="row mb-3">
            <div class="col-md-5">
          Please select an option: 
          </div>
          <div class="col-md-3">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="group" value="Student" required>
            <label class="form-check-label" for="inlineRadio1" >Student</label>
          </div></div>
          <div class="col-md-3">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="group" value="Teacher" required>
            <label class="form-check-label" for="inlineRadio2" >Teacher</label>
          </div></div>
          </div>
<br>
          <div class="row mb-3">
            <div class="col-md-3">
                <label for="exampleInputEmail1" class="form-label">Name</label>
              </div>
              <div class="col-md-8">
                <input type="text" class="form-control" name = "first_name" required >
              </div>
              </div>


              <div class="row mb-3">
                <div class="col-md-3">
              <label for="exampleInputEmail1" class="form-label">Username</label>
              </div>
              <div class="col-md-8">
              <input type="text" class="form-control"  name="username"  required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
            </div>
            <div class="col-md-8">
              <input type="password" class="form-control" name="password" required >
            </div>
            </div>
          
            <div class="row mb-3">
              <div class="col-md-3">
                <label for="exampleInputPassword1" class="form-label">Re-enter Password</label>
              </div>
              <div class="col-md-8">
                <input type="password" class="form-control" name="repassword" required >
              </div>
              </div>

            <br>
            <p> Already have account? <a href = '/login2'> Login </a></p>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
</div>
{% endblock %}
